<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Installation – Simple Media Encoder</title>
    <link rel="icon" href="./assets/appIcon_simplemediaencoder.png" />
    <link rel="stylesheet" href="./styles.css" />
    <meta name="description"
        content="Installation guide for Simple Media Encoder – releases and building from source." />
    <style>
        .doc-main {
            padding: 38px 0 56px;
        }

        .markdown-body {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 22px;
            box-shadow: var(--shadow);
        }

        .markdown-body h1,
        .markdown-body h2,
        .markdown-body h3 {
            margin-top: 18px;
        }

        .markdown-body pre {
            background: color-mix(in srgb, var(--panel) 60%, var(--bg));
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 10px;
            overflow: auto;
        }

        .markdown-body code {
            background: color-mix(in srgb, var(--panel) 50%, var(--bg));
            padding: 1px 5px;
            border-radius: 6px;
        }

        .markdown-body a {
            color: var(--brand);
        }
    </style>
</head>

<body>
    <header class="site-header">
        <div class="container header-inner">
            <div class="brand">
                <img class="brand-icon" src="./assets/appIcon_simplemediaencoder.png" width="28" height="28"
                    alt="icon" />
                <span class="brand-name">Simple Media Encoder</span>
            </div>
            <nav class="nav">
                <a href="./index.html">Home</a>
                <a href="./readme.html">Docs</a>
                <a href="./usage.html">Usage</a>
                <a class="btn btn-primary small" href="../releases/">Get from Releases</a>
            </nav>
        </div>
    </header>

    <main class="doc-main">
        <div class="container">
            <article id="doc" class="markdown-body"></article>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <div class="footer-left">© <span id="year"></span> Simple Media Encoder</div>
            <div class="footer-right">
                <a href="./index.html">Home</a>
                <a href="./readme.html">Docs</a>
                <a href="./usage.html">Usage</a>
            </div>
        </div>
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
    <script>
        async function loadMarkdown(path) {
            const res = await fetch(path);
            return await res.text();
        }
        function escapeHtml(s) {
            return s.replace(/[&<>\"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;' }[c]));
        }
        function renderSimpleMarkdown(md) {
            let html = md;
            html = html.replace(/^######\s+(.*)$/gm, '<h6>$1</h6>')
                .replace(/^#####\s+(.*)$/gm, '<h5>$1</h5>')
                .replace(/^####\s+(.*)$/gm, '<h4>$1</h4>')
                .replace(/^###\s+(.*)$/gm, '<h3>$1</h3>')
                .replace(/^##\s+(.*)$/gm, '<h2>$1</h2>')
                .replace(/^#\s+(.*)$/gm, '<h1>$1</h1>');
            html = html.replace(/```([\s\S]*?)```/g, (m, p1) => `<pre><code>${escapeHtml(p1).trim()}</code></pre>`);
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
            html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                .replace(/\*([^*]+)\*/g, '<em>$1</em>');
            html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
            html = html.replace(/^(?:- |\* )(.*)$/gm, '<li>$1</li>');
            html = html.replace(/(<li>[^<]*<\/li>\n?)+/g, m => `<ul>${m}</ul>`);
            html = html.replace(/^(\d+)\. (.*)$/gm, '<li>$2</li>');
            html = html.replace(/(<li>[^<]*<\/li>\n?)+/g, m => m.includes('<ul>') ? m : `<ul>${m}</ul>`);
            html = html.replace(/^(?!<h\d|<ul>|<li>|<pre>|<p>|<blockquote>|<img|<table)([^\n]+)\n/gm, '<p>$1</p>');
            return html;
        }
        (async () => {
            const md = await loadMarkdown('./installation.md');
            document.getElementById('doc').innerHTML = renderSimpleMarkdown(md);
        })();
    </script>
</body>

</html>
